<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shot search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <input id="q" type="search" placeholder="Describe the shot ( / to focus )" autocomplete="off">
    <!--  GET /api/search?mode=visual|text|both. Weight is unused for simplicity. -->
    <label>Search
      <select id="smode">
        <option value="both" selected>Visual + text</option>
        <option value="visual">Visual only</option>
        <option value="text">Transcript only</option>
      </select></label>
    <!--  filter is sent as ?video_id=<id> -->
    <span id="video-chip" hidden></span>
    <label>Results <input id="limit" type="number" value="60" min="10" max="200" step="10"></label>
    <select id="mode" title="Task mode"><option value="kis">KIS</option><option value="avs">AVS</option></select>
    <!--  POST /api/submit requires evaluation_id in the body, so the UI keeps it here. -->
    <label>DRES eval <input id="eval" type="text" placeholder="evaluation ID" autocomplete="off"></label>
    <button id="help-btn" title="Shortcuts">?</button>
  </header>

  <main>
    <section id="results-wrap">
      <div id="results-info"></div>
      <div id="grid" tabindex="0"></div>
    </section>

    <aside id="preview">
      <video id="player" controls preload="metadata"></video>
      <div id="shot-info">No shot selected</div>
      <div id="shot-text"></div>
      <div class="row">
        <button id="btn-loop">Loop</button>
        <button id="btn-slow">0.5x</button>
        <button id="btn-ctx-" title="Shrink the preview window by 2 s each side">Tighter</button>
        <button id="btn-ctx+" title="Widen the preview window by 2 s each side">Wider</button>
      </div>
      <div class="row">
        <button id="btn-similar">More like this (M)</button>
        <button id="btn-video">Video shots (V)</button>
      </div>
      <div class="row">
        <label>Submit range
          <select id="range">
            <option value="shot" selected>Selected shot</option>
            <option value="segment">Whole segment</option>
          </select></label>
      </div>
      <div id="target-info"></div>
      <div class="row">
        <button id="btn-submit" class="primary">Submit (S)</button>
        <button id="btn-submit-sel" hidden>Submit selected (0)</button>
      </div>
      <div id="confirm" hidden></div>
      <div id="verdict" hidden></div>
      <h3>Submitted</h3>
      <ul id="history"></ul>
    </aside>
  </main>

  <footer id="strip"></footer>
  <div id="help" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
